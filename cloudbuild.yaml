steps:
  # Build server image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/leaselynx-ai/opensign-repo/opensignserver:leaselynx'
      - '-f'
      - 'apps/OpenSignServer/Dockerhubfile'
      - '.'
    id: 'build-server'

  # Build client image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/leaselynx-ai/opensign-repo/opensign:leaselynx'
      - '-f'
      - 'apps/OpenSign/Dockerhubfile'
      - '.'
    id: 'build-client'

images:
  - 'us-central1-docker.pkg.dev/leaselynx-ai/opensign-repo/opensignserver:leaselynx'
  - 'us-central1-docker.pkg.dev/leaselynx-ai/opensign-repo/opensign:leaselynx'

timeout: '2400s'
options:
  machineType: 'E2_HIGHCPU_8'
